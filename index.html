<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Đảm bảo có title để validators (W3C/Wave) không báo lỗi -->
    <title>Accessible Photo Gallery</title> 
    <link rel="stylesheet" href="style.css">
</head>

<!-- Step 8: Thêm listener onload vào body -->
<body onload="initializeGallery()">
    
    <div id="image">Hover over an image below to display here.</div>

    <!-- Step 2 & 6: 6 hình ảnh với alt text. Bổ sung onfocus và onblur -->
    <img class="preview" alt="Bầu trời đêm" src="https://images.pexels.com/photos/10747740/pexels-photo-10747740.jpeg" 
         onmouseover="upDate(this)" onmouseout="undo()" 
         onfocus="upDate(this)" onblur="undo()">
         
    <img class="preview" alt="Phong cảnh biển" src="https://images.pexels.com/photos/7872581/pexels-photo-7872581.jpeg" 
         onmouseover="upDate(this)" onmouseout="undo()" 
         onfocus="upDate(this)" onblur="undo()">
         
    <img class="preview" alt="Rừng nhiệt đới" src="https://images.pexels.com/photos/32795635/pexels-photo-32795635.jpeg" 
         onmouseover="upDate(this)" onmouseout="undo()" 
         onfocus="upDate(this)" onblur="undo()">
         
    <img class="preview" alt="Sa mạc" src="https://images.pexels.com/photos/2088210/pexels-photo-2088210.jpeg" 
         onmouseover="upDate(this)" onmouseout="undo()" 
         onfocus="upDate(this)" onblur="undo()">
         
    <img class="preview" alt="Thành phố hiện đại" src="https://images.pexels.com/photos/373893/pexels-photo-373893.jpeg" 
         onmouseover="upDate(this)" onmouseout="undo()" 
         onfocus="upDate(this)" onblur="undo()">
         
    <img class="preview" alt="Hoàng hôn trên sông" src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg" 
         onmouseover="upDate(this)" onmouseout="undo()" 
         onfocus="upDate(this)" onblur="undo()">

    <script src="script.js"></script>
</body>
</html>
